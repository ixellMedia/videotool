<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lecteur vidéo</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#container{
    position:relative;
    width:100%;
    height:100%;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

/* Zone titre + chaîne */
#bloc-titre{
    position:absolute;
    top:0;
    left:0;
    width:700px;
    height:110px;
    z-index:9999;

    background:red;
    opacity:0.5;

}

/* Zone Youtube */
#bloc-youtube{
    position:absolute;
    bottom:0;
    right:0;
    width:330px;
    height:100px;
    z-index:9999;

    background:red;
    opacity:0.5;

}


</head>

<body>


<div id="container">

    <iframe
        id="player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
    </iframe>

    <div id="bloc-titre"></div>
    <div id="bloc-youtube"></div>

</div>


<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("v");

if(id){
document.getElementById("player").src =
`https://www.youtube.com/embed/${id}?rel=0&modestbranding=1&playsinline=1`;
}

</script>

</body>
</html>
